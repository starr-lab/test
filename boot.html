<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayStation 5 Startup</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 45%,#183a68,#050812 65%);color:#fff;font:20px Arial,sans-serif;height:100vh;display:grid;place-items:center}
main{text-align:center} .mark{font-size:clamp(48px,10vw,110px);font-weight:200;letter-spacing:12px;text-shadow:0 0 24px #4aaaff}
p{letter-spacing:5px;color:#b9d9ff;font-size:clamp(12px,2vw,20px)}.line{height:3px;width:160px;background:#65baff;margin:35px auto;box-shadow:0 0 18px #65baff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scaleX(.55)}}
</style></head><body><main><div class="mark">PS5</div><div class="line"></div><p>POWERING ON</p></main></body></html>
